name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: entry
    attributes:
      label: Entry point
      options:
        - cookie-prefs (core)
        - cookie-prefs/react
        - cookie-prefs/next
        - cookie-prefs/theme
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
