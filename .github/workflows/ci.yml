name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:package
      - run: npm run size

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The exceptions, each with its reason, are listed in the script.
      - name: Fail on high or critical advisories
        run: node .github/scripts/audit.mjs

  react-18:
    name: React 18 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm install --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E on Next ${{ matrix.next }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        next: [14, 15, 16]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - run: npm ci
      - run: npm ci --prefix e2e
      - run: npm run typecheck --prefix e2e

      - name: Read the Playwright version and the runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # The three browsers need about 140 MB of system packages, and apt mirrors are sometimes slow: apt downloads
      # them into a folder that is cached with the browsers, so a cache hit installs them without downloading.
      - name: Keep the downloaded system packages in a cacheable folder
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' ~/.cache/apt-archives | sudo tee /etc/apt/apt.conf.d/99-cacheable-archives

      - name: Cache the Playwright browsers and their system packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit

      # Browsers already restored from the cache are skipped; the system packages are installed in any case.
      - name: Install Chromium, Firefox and WebKit with their system packages
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo chown -R "$USER" ~/.cache/apt-archives
        working-directory: e2e

      - name: Cache the Next.js build cache
        uses: actions/cache@v6
        with:
          path: e2e/.apps/next${{ matrix.next }}/.next/cache
          key: next-cache-${{ matrix.next }}-${{ hashFiles('e2e/versions.json', 'e2e/app/**') }}
          restore-keys: next-cache-${{ matrix.next }}-

      - name: Build and pack the package
        run: node e2e/scripts/run.mjs ${{ matrix.next }} pack

      - name: Install and build the Next.js ${{ matrix.next }} app
        run: node e2e/scripts/run.mjs ${{ matrix.next }} app

      # One app build and one `next start`, tested in Chromium, Firefox and WebKit.
      - name: Run the Playwright suite
        run: node e2e/scripts/run.mjs ${{ matrix.next }} test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-next-${{ matrix.next }}
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  e2e-react-router:
    name: E2E on React Router 7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
            e2e/react-router/package-lock.json

      - run: npm ci
      - run: npm ci --prefix e2e
      - run: npm run typecheck --prefix e2e

      - name: Read the Playwright version and the runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # The same browser and system package cache as the `e2e` job (same key).
      - name: Keep the downloaded system packages in a cacheable folder
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' ~/.cache/apt-archives | sudo tee /etc/apt/apt.conf.d/99-cacheable-archives

      - name: Cache the Playwright browsers and their system packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit

      - name: Install Chromium, Firefox and WebKit with their system packages
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo chown -R "$USER" ~/.cache/apt-archives
        working-directory: e2e

      - name: Build and pack the package
        run: node e2e/scripts/run.mjs react-router pack

      # `npm ci`, the packed package on top, `react-router typegen && tsc`, `react-router build`.
      - name: Install, typecheck and build the React Router app
        run: node e2e/scripts/run.mjs react-router app

      # One build and one `react-router-serve`, tested in Chromium, Firefox and WebKit.
      - name: Run the Playwright suite
        run: node e2e/scripts/run.mjs react-router test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-react-router
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: demo/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  changelog-check:
    name: CHANGELOG pre-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for releasable commits since last tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"

          HAS=$(git log $RANGE --pretty=format:"%s" \
            | grep -qE "^(feat|fix|refactor|perf|docs|ci)(\([^)]+\))?!?:" && echo yes || echo no)

          if [ "$HAS" = "no" ]; then
            echo "::error::No releasable commits (feat/fix/refactor/perf/docs/ci) found since ${LAST_TAG:-the beginning}. The next release run would emit an empty CHANGELOG. Add at least one commit with a conventional prefix."
            exit 1
          fi

          echo "Releasable commits found since ${LAST_TAG:-the beginning} — release workflow will generate a non-empty CHANGELOG."

  ci-ok:
    name: CI ok
    runs-on: ubuntu-latest
    needs: [test, audit, react-18, e2e, e2e-react-router, demo]
    if: always()
    steps:
      - name: Fail unless every required job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.audit.result }}" != "success" ] || [ "${{ needs.react-18.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.e2e-react-router.result }}" != "success" ] || [ "${{ needs.demo.result }}" != "success" ]; then
            echo "::error::test: ${{ needs.test.result }}, audit: ${{ needs.audit.result }}, react-18: ${{ needs.react-18.result }}, e2e: ${{ needs.e2e.result }}, e2e-react-router: ${{ needs.e2e-react-router.result }}, demo: ${{ needs.demo.result }}"
            exit 1
          fi
