name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:package
      - run: npm run size

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The exceptions, each with its reason, are listed in the script.
      - name: Fail on high or critical advisories
        run: node .github/scripts/audit.mjs

  react-18:
    name: React 18 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm install --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npm run typecheck
      - run: npm test

  # The e2e jobs run in the Playwright image, which holds Chromium, Firefox and WebKit with their system libraries
  # (no apt at run time). Its tag must be the installed Playwright version, read here from e2e's lockfile so a
  # Dependabot bump of @playwright/test moves the image with it.
  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: e2e/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read the @playwright/test version from e2e/package-lock.json
        id: version
        run: |
          version=$(jq -er '.packages["node_modules/@playwright/test"].version' e2e/package-lock.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mcr.microsoft.com/playwright:v$version-noble"

  e2e:
    name: E2E on Next ${{ matrix.next }}
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The runner's user (1001) owns the workspace and $HOME, which Firefox requires; --ipc=host keeps Chromium from
    # running out of shared memory. The image sets PLAYWRIGHT_BROWSERS_PATH=/ms-playwright.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        next: [14, 15, 16]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - run: npm ci
      - run: npm ci --prefix e2e
      - run: npm run typecheck --prefix e2e

      - name: Cache the Next.js build cache
        uses: actions/cache@v6
        with:
          path: e2e/.apps/next${{ matrix.next }}/.next/cache
          key: next-cache-${{ matrix.next }}-${{ hashFiles('e2e/versions.json', 'e2e/app/**') }}
          restore-keys: next-cache-${{ matrix.next }}-

      - name: Build and pack the package
        run: node e2e/scripts/run.mjs ${{ matrix.next }} pack

      - name: Install and build the Next.js ${{ matrix.next }} app
        run: node e2e/scripts/run.mjs ${{ matrix.next }} app

      # One app build and one `next start`, tested in Chromium, Firefox and WebKit.
      - name: Run the Playwright suite
        run: node e2e/scripts/run.mjs ${{ matrix.next }} test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-next-${{ matrix.next }}
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  e2e-react-router:
    name: E2E on React Router 7
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same image and options as the `e2e` job.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
            e2e/react-router/package-lock.json

      - run: npm ci
      - run: npm ci --prefix e2e
      - run: npm run typecheck --prefix e2e

      - name: Build and pack the package
        run: node e2e/scripts/run.mjs react-router pack

      # `npm ci`, the packed package on top, `react-router typegen && tsc`, `react-router build`.
      - name: Install, typecheck and build the React Router app
        run: node e2e/scripts/run.mjs react-router app

      # One build and one `react-router-serve`, tested in Chromium, Firefox and WebKit.
      - name: Run the Playwright suite
        run: node e2e/scripts/run.mjs react-router test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-react-router
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: demo/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  changelog-check:
    name: CHANGELOG pre-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for releasable commits since last tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"

          HAS=$(git log $RANGE --pretty=format:"%s" \
            | grep -qE "^(feat|fix|refactor|perf|docs|ci)(\([^)]+\))?!?:" && echo yes || echo no)

          if [ "$HAS" = "no" ]; then
            echo "::error::No releasable commits (feat/fix/refactor/perf/docs/ci) found since ${LAST_TAG:-the beginning}. The next release run would emit an empty CHANGELOG. Add at least one commit with a conventional prefix."
            exit 1
          fi

          echo "Releasable commits found since ${LAST_TAG:-the beginning} — release workflow will generate a non-empty CHANGELOG."

  ci-ok:
    name: CI ok
    runs-on: ubuntu-latest
    needs: [test, audit, react-18, playwright, e2e, e2e-react-router, demo]
    if: always()
    steps:
      - name: Fail unless every required job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.audit.result }}" != "success" ] || [ "${{ needs.react-18.result }}" != "success" ] || [ "${{ needs.playwright.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.e2e-react-router.result }}" != "success" ] || [ "${{ needs.demo.result }}" != "success" ]; then
            echo "::error::test: ${{ needs.test.result }}, audit: ${{ needs.audit.result }}, react-18: ${{ needs.react-18.result }}, playwright: ${{ needs.playwright.result }}, e2e: ${{ needs.e2e.result }}, e2e-react-router: ${{ needs.e2e-react-router.result }}, demo: ${{ needs.demo.result }}"
            exit 1
          fi
